services:
  db:
    container_name: database
    image: mysql:8.0.43
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


  payara:
    container_name: payara
    image: payara/server-full:6.2025.8-jdk17
    env_file: .env
    environment:
      PAYARA_ARGS: "--debug=true"  # JDWP actif
      ADMIN_PASSWORD: "admin"                    # mot de passe admin (adaptable)
      SECURE_ADMIN: "false"
    ports:
      - "8080:8080"   # applis
      - "4848:4848"   # admin
      - "9009:9009"   # debug
    #if you need to rebuild the server config, make sure to delete the volumes with docker compose down -v
    volumes:
      - ./docker/post-boot-commands.asadmin:/opt/payara/config/post-boot-commands.asadmin:ro
      - ./docker/pre-boot-commands.asadmin:/opt/payara/config/pre-boot-commands.asadmin:ro

volumes:
  db_data:
