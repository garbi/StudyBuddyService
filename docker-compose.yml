services:
  #MySQL image
  #Make sure you have plugged your jdbc pool and associated resource on the server
  #(through post-boot-commands and recreating the docker image or manually through the admin console @localhost:4848
  db:
    container_name: database
    image: mysql:8.0.43
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  #Payara server
  payara:
    container_name: payara
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECURE_ADMIN: "true"
      ADMIN_USER: "${ADMIN_USER}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    ports:
      - "8080:8080"   #apps
      - "4848:4848"   #admin
      - "${DEBUG_PORT}:${DEBUG_PORT}"   #debug JDWP
    volumes:
      #Directly mounting settings to the server config -> needs a restart
      - ./docker/post-boot-commands.asadmin:/opt/payara/config/post-boot-commands.asadmin:ro
      - ./docker/pre-boot-commands.asadmin:/opt/payara/config/pre-boot-commands.asadmin:ro
      #auto deploy (maps local target artefact to container) - You must have StudyBuddyService and StudyBuddyWebapp projects at the same file system level
      - ./target/StudyBuddyService-1.0-SNAPSHOT.war:/opt/payara/appserver/glassfish/domains/domain1/autodeploy/StudyBuddyService-1.0-SNAPSHOT.war
      - ../StudyBuddyWebapp/target/StudyBuddyWebapp-1.0-SNAPSHOT.war:/opt/payara/appserver/glassfish/domains/domain1/autodeploy/StudyBuddyWebapp-1.0-SNAPSHOT.war
      #Workspace volumes
      - ${SERVICE_HOST_PATH}:/workspace-service
      - ${WEBAPP_HOST_PATH}:/workspace-webapp

volumes:
  db_data:
